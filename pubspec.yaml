name: fitnepal
description: FitNepal — Offline-First Android Nutrition, Calorie, Macro & Hydration Tracker built with Flutter and Drift SQLite.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  drift: ^2.18.0
  drift_flutter: ^0.1.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0
  fl_chart: ^0.68.0
  flutter_local_notifications: ^17.2.1
  timezone: ^0.9.4
  image_picker: ^1.1.2
  file_picker: ^8.0.6
  shared_preferences: ^2.2.3
  permission_handler: ^11.3.1
  intl: ^0.19.0
  archive: ^3.6.1
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
  assets:
    - assets/seed/starter_foods.json
    - assets/images/
